services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: runtime
    expose:
      - "5000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=5000
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - COLLECTION_NAME=training_docs
      - EMBEDDING_MODEL=intfloat/multilingual-e5-large
      - LLM_MODEL=gemma3:1b
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=200
      - OLLAMA_HOST=host.docker.internal
      - OLLAMA_PORT=11434
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - ANONYMIZED_TELEMETRY=False
    depends_on:
      chroma:
        condition: service_healthy
    networks:
      - chatbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  importer:
    build:
      context: ./importer
      dockerfile: Dockerfile
      target: runtime
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - COLLECTION_NAME=training_docs
      - EMBEDDING_MODEL=intfloat/multilingual-e5-large
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - ANONYMIZED_TELEMETRY=False
    volumes:
      - ./importer/documents:/app/documents
      - ./importer/logs:/app/logs
    depends_on:
      chroma:
        condition: service_healthy
    networks:
      - chatbot-network
    profiles:
      - tools

  chroma:
    image: chromadb/chroma:0.5.23
    expose:
      - "8000"
    environment:
      - ANONYMIZED_TELEMETRY=False
    volumes:
      - chroma-data:/chroma/chroma
    networks:
      - chatbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 5

  nginx:
    build:
      context: ./nginx
    environment:
      - QABOT_AUTH_USER=${QABOT_AUTH_USER:-qabot}
    secrets:
      - qabot_auth_password
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./build:/usr/share/nginx/html:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
    networks:
      - chatbot-network
    restart: unless-stopped

volumes:
  chroma-data:

secrets:
  qabot_auth_password:
    environment: QABOT_AUTH_PASSWORD

networks:
  chatbot-network:
    driver: bridge
